[package]
name = "markdown"
version = "3.11.2"
edition = "2021"
description = "A Rust implementation of Python-Markdown: John Gruber's Markdown with the Python-Markdown extensions."
license = "BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/Python-Markdown/markdown"
rust-version = "1.85"

[lib]
name = "markdown"
path = "src/lib.rs"

[[bin]]
name = "markdown"
path = "src/main.rs"

[dependencies]
fancy-regex = "=0.20.0"
